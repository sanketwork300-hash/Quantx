<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Data flow: market data passes through a quality layer into one MarketState snapshot, which feeds valuation, risk and execution, which together form the decision context.">
<title>Data flow: market data passes through a quality layer into one MarketState snapshot, which feeds valuation, risk and execution, which together form the decision context.</title>
<style>
  .bg{fill:#ffffff;stroke:#d3d7dd} .plate{fill:#f4f5f7;stroke:#7c838d}
  .ink{fill:#1d2025} .muted{fill:#565c66} .dot{fill:#c9ced5}
  .line{stroke:#1d2025;fill:none} .soft{stroke:#7c838d;fill:none} .hair{stroke:#d3d7dd;fill:none}
  .solid{fill:#1d2025} .onsolid{fill:#ffffff} .mark{fill:#b42318} .markline{stroke:#b42318;fill:none}
  text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#26292e;stroke:#41464e} .plate{fill:#30343a;stroke:#8a919b}
    .ink{fill:#f2f3f5} .muted{fill:#b4bac3} .dot{fill:#3a3f47}
    .line{stroke:#f2f3f5} .soft{stroke:#8a919b} .hair{stroke:#41464e}
    .solid{fill:#f2f3f5} .onsolid{fill:#1c1e22} .mark{fill:#ff8a80} .markline{stroke:#ff8a80}
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }

  .flowline{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-14}}
  @media (prefers-reduced-motion: reduce){ .pulse{display:none} }
</style>
<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" class="dot"/></pattern></defs><path class="bg" d="M0.5 0.5H1172L1199.5 28V419.5H0.5Z"/><path fill="url(#g)" d="M1 1H1172L1199 28V419H1Z"/>
<path class="soft flowline" stroke-width="2" d="M220 210H260"/>
<path class="soft flowline" stroke-width="2" d="M450 210H490"/>
<path class="soft flowline" stroke-width="2" d="M680 210C710 210 710 80 740 80"/>
<path class="soft flowline" stroke-width="2" d="M680 210H740"/>
<path class="soft flowline" stroke-width="2" d="M680 210C710 210 710 340 740 340"/>
<path class="soft flowline" stroke-width="2" d="M930 80C955 80 955 210 980 210"/>
<path class="soft flowline" stroke-width="2" d="M930 210H980"/>
<path class="soft flowline" stroke-width="2" d="M930 340C955 340 955 210 980 210"/>
<path class="plate" d="M30 175H208L220 187V245H30Z"/>
<text class="ink" x="44" y="205" font-size="18" font-weight="700">Market</text>
<text class="muted" x="44" y="227" font-size="13">files, live feed, synthetic</text>
<path class="plate" d="M260 175H438L450 187V245H260Z"/>
<text class="ink" x="274" y="205" font-size="18" font-weight="700">Market data layer</text>
<text class="muted" x="274" y="227" font-size="13">quality scores, row counts</text>
<path class="solid" d="M490 175H668L680 187V245H490Z"/>
<text class="onsolid" x="504" y="205" font-size="18" font-weight="700">MarketState</text>
<text class="onsolid" x="504" y="227" font-size="13">one consistent snapshot</text>
<path class="plate" d="M740 45H918L930 57V115H740Z"/>
<text class="ink" x="754" y="75" font-size="18" font-weight="700">Valuation</text>
<text class="muted" x="754" y="97" font-size="13">IV, SVI, SSVI, Heston</text>
<path class="plate" d="M740 175H918L930 187V245H740Z"/>
<text class="ink" x="754" y="205" font-size="18" font-weight="700">Risk</text>
<text class="muted" x="754" y="227" font-size="13">VaR, stress, margin</text>
<path class="plate" d="M740 305H918L930 317V375H740Z"/>
<text class="ink" x="754" y="335" font-size="18" font-weight="700">Execution</text>
<text class="muted" x="754" y="357" font-size="13">cost analysis, simulation</text>
<path class="plate" d="M980 175H1158L1170 187V245H980Z"/>
<text class="ink" x="994" y="205" font-size="18" font-weight="700">Decision context</text>
<text class="muted" x="994" y="227" font-size="13">no recommendation field</text>
<circle class="solid pulse" r="5"><animateMotion dur="5s" repeatCount="indefinite" path="M220 210H260M450 210H490M680 210H740M930 210H980" /></circle>
<text class="muted" x="30" y="392" font-size="14">Every engine reads the same MarketState, so differences between results come from the question, not from the clock.</text>
</svg>
